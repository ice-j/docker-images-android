name: Build

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "versions.env"
      - "docker-bake.hcl"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      push:
        description: Push images to the registry
        type: boolean
        default: true
  # Used by update.yml to build a version bump before it lands on main.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ""
      push:
        description: Push images to the registry
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ inputs.push || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      CACHE_TYPE: gha
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Load versions
        run: |
          grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "REGISTRY=ghcr.io/$owner" >> "$GITHUB_ENV"
          echo "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build amd64 only and load it into the local daemon for testing.
      - name: Build (amd64)
        uses: docker/bake-action@v6
        with:
          source: .
          load: true
          set: |
            *.platform=linux/amd64

      - name: Smoke test
        run: |
          set -eux
          sdk="$REGISTRY/android-sdk:$ANDROID_PLATFORM_VERSION"
          ndk="$REGISTRY/android-sdk:$ANDROID_PLATFORM_VERSION-ndk"

          docker run --rm "$sdk" java -version
          installed="$(docker run --rm "$sdk" sdkmanager --list_installed)"
          echo "$installed"
          # Newer cmdline-tools print package paths with '/' instead of ';'.
          grep -qE "build-tools[;/]$ANDROID_BUILD_TOOLS_VERSION " <<< "$installed"
          for p in $ANDROID_PLATFORM_PACKAGES; do grep -qE "platforms[;/]$p " <<< "$installed"; done

          # Cross-compile a trivial program to check the NDK toolchain works.
          docker run --rm "$ndk" sh -euxc '
            printf "int main(void) { return 0; }\n" > /tmp/hello.c
            "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
              --target=aarch64-linux-android30 /tmp/hello.c -o /tmp/hello
            test -s /tmp/hello
          '

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (multi-arch)
        uses: docker/bake-action@v6
        with:
          source: .
          push: ${{ env.PUSH == 'true' }}

      - name: Summary
        run: |
          {
            echo "### Versions (pushed: $PUSH)"
            echo '```'
            grep -E '^[A-Z_]+=' versions.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
